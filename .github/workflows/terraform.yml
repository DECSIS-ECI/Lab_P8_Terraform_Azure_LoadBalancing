name: Terraform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VERSION: '1.6.0'

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        working-directory: ./infra
        run: terraform fmt -recursive -check

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra
        run: terraform plan -var-file=env/dev.tfvars -out plan.tfplan
        continue-on-error: true

      - name: Post Plan as Artifact
        if: always()
        working-directory: ./infra
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: plan.tfplan
          retention-days: 7

      - name: Add Plan Comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.tfplan', 'utf8');
            const body = `## Terraform Plan 📝\n\`\`\`\n${plan.substring(0, 65000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

      - name: Terraform Apply (Manual)
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        working-directory: ./infra
        run: terraform apply -auto-approve plan.tfplan

      - name: Terraform Destroy (Manual)
        if: github.event_name == 'workflow_dispatch' && github.inputs.action == 'destroy'
        working-directory: ./infra
        run: terraform destroy -auto-approve -var-file=env/dev.tfvars